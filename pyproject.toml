[project]
name = "construction-drawing-intelligence"
version = "0.1.0"
description = "Grounded search and question answering for construction drawings"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8",
  "pydantic-settings>=2.4", "sqlalchemy>=2.0", "alembic>=1.13",
  "psycopg[binary]>=3.2", "pgvector>=0.3", "pymupdf>=1.24",
  "google-genai>=1.0", "python-multipart>=0.0.9"
]
[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.core", "app.models", "app.schemas", "app.services", "app.routers", "app.ai", "app.evaluation", "app.repositories"]
